[package]
name = "rail"
version = "0.1.0"
edition = "2024"
description = "Redundant Array of Inexpensive Links: enterprise-grade URL shortener redundancy via nested load balancing across third-party URL shorteners"
license = "MIT"
authors = ["Helge Sverre <helge.sverre@gmail.com>"]
repository = "https://github.com/HelgeSverre/rail-rs"
readme = "README.md"
keywords = ["url-shortener", "load-balancer", "redundancy", "enterprise"]
categories = ["web-programming::http-server", "command-line-utilities"]

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive", "env"] }
qrcode = "0.14.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.8", features = ["serde"] }
