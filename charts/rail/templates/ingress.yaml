{{- if .Values.ingress.enabled }}
{{- $ctx := dict "root" . "name" .Values.ingress.instance }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "rail.instanceName" $ctx }}
  labels:
    {{- include "rail.labels" $ctx | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "rail.instanceName" $ctx }}
                port:
                  name: http
{{- end }}
