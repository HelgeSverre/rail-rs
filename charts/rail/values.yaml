image:
  repository: ghcr.io/helgesverre/rail-rs
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

port: 8080
clusterDomain: cluster.local
# Seconds between health sweeps, per instance. Every layer sweeps independently.
healthInterval: 60
defaultStrategy: round-robin

# Each instance keeps its own SQLite database, so replicas must stay at 1.
# Scaling horizontally is what nesting is for.
persistence:
  enabled: false
  size: 64Mi

resources:
  requests: { cpu: 5m, memory: 16Mi }
  limits: { memory: 64Mi }

# Credentials for licensed vendors (RAIL_XGD_KEY, RAIL_CUTTLY_KEY, ...; see the README), loaded
# into every instance from an existing Secret. An instance can name its own with
# `credentialsSecret`. The chart never creates the Secret.
credentialsSecret: ""

# The topology. Upstreams are shortener names (is.gd, tinyurl, da.gd, spoo.me, ...; see the README) or
# `rail:<instance>` to reference another instance in this release. Cycles are allowed to
# deploy, and RAIL refuses them at runtime, as is tradition.
instances:
  - name: leaf-a
    upstreams: [is.gd, spoo.me]
  - name: leaf-b
    upstreams: [tinyurl, da.gd]
    strategy: fastest
  - name: leaf-c
    upstreams: [ulvis, clck.ru]
    strategy: random
  - name: mid-1
    upstreams: [rail:leaf-a, rail:leaf-b]
  - name: mid-2
    upstreams: [rail:leaf-b, rail:leaf-c]
  - name: edge
    upstreams: [rail:mid-1, rail:mid-2, tinyurl]

# Routes every instance at <instance>.<host>. Every tier needs a public name: a visitor's
# redirect chain passes through all of them. The hosts must also resolve from inside the
# cluster, because each instance health-checks its mirrors through their public URLs.
ingress:
  enabled: false
  className: ""
  host: rail.example.com
  annotations: {}
  tls:
    enabled: false
    # Certificate covering every <instance>.<host> (a wildcard works). Leave empty to let
    # the ingress controller or an annotation-driven issuer (cert-manager) provide it.
    secretName: ""
