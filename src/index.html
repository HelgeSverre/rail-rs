<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAIL</title>
<style>
  :root { color-scheme: light dark; --fg: #1b1b1b; --bg: #f4f1ea; --muted: #6b665c; --line: #d6d0c4; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ece8df; --bg: #161513; --muted: #9a9488; --line: #34312c; --accent: #fb923c; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 40px; margin: 0; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 4px 0 32px; }
  form { display: flex; gap: 8px; flex-wrap: wrap; }
  input { flex: 1 1 320px; padding: 12px; font: inherit; background: transparent; color: inherit; border: 1px solid var(--line); border-radius: 6px; }
  button { padding: 12px 18px; font: inherit; border: 0; border-radius: 6px; background: var(--accent); color: #fff; cursor: pointer; }
  .meta { margin-top: 24px; color: var(--muted); font-size: 13px; }
  #out { margin-top: 32px; }
  .short { font-size: 20px; word-break: break-all; }
  .short a { color: var(--accent); }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
  td, th { text-align: left; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; word-break: break-all; }
  th { color: var(--muted); font-weight: normal; }
  .row { display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start; }
  .qr { background: #fff; padding: 8px; border-radius: 6px; width: 176px; }
  .bad { color: #dc2626; }
</style>
</head>
<body>
<main>
  <h1>R<span>A</span>IL</h1>
  <p class="sub">Redundant Array of Inexpensive Links. Your URL, shortened by several shorteners, load-balanced, for no reason.</p>
  <form id="f">
    <input id="u" type="url" required placeholder="https://example.com/a/perfectly/fine/url" autofocus>
    <button>Shorten redundantly</button>
  </form>
  <p class="meta" id="meta"></p>
  <div id="out"></div>
</main>
<script>
  const INFO = /*RAIL_INFO*/null;
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  document.getElementById("meta").textContent =
    `instance ${INFO.instance} · strategy ${INFO.strategy} · upstreams ${INFO.upstreams.join(", ") || "none (degraded leaf)"}`;
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const out = document.getElementById("out");
    out.textContent = "Contacting an unreasonable number of shorteners…";
    const res = await fetch("/api/shorten", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ url: document.getElementById("u").value }) });
    const r = await res.json();
    if (!res.ok) { out.innerHTML = `<p class="bad">${esc(r.error)}</p>`; return; }
    const rows = r.mirrors.map((m) => `<tr><td>${esc(m.upstream)}</td><td><a href="${esc(m.short_url)}">${esc(m.short_url)}</a></td></tr>`).join("");
    const failed = r.failed.map((f) => `<tr class="bad"><td>${esc(f.upstream)}</td><td>${esc(f.error)}</td></tr>`).join("");
    out.innerHTML = `
      <div class="row">
        <img class="qr" src="/${esc(r.id)}/qr" alt="QR code for ${esc(r.short_url)}">
        <div>
          <p class="short"><a href="${esc(r.short_url)}">${esc(r.short_url)}</a></p>
          <p>compression ratio ${r.compression_ratio}${r.compression_ratio > 1 ? " (longer than before, as intended)" : ""}${r.reused ? " · reused existing link" : ""}${r.degraded ? ' · <span class="bad">degraded: no mirrors</span>' : ""}</p>
          <p><a href="/${esc(r.id)}/trace">trace the redirect chain</a> · <a href="/api/tree">balancer tree</a></p>
        </div>
      </div>
      <table><tr><th>upstream</th><th>mirror</th></tr>${rows}${failed}</table>`;
  });
</script>
</body>
</html>
