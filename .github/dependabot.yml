version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    groups:
      all: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      all: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
